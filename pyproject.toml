[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[project]
name = "cardiac-mri-3d-segmentation"
version = "0.1.0"
description = "Professional PyTorch project for multiclass 3D cardiac MRI segmentation using the ACDC dataset."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "William Popkov" },
]
dependencies = [
    "matplotlib>=3.9,<4.0",
    "nibabel>=5.3,<6.0",
    "numpy>=2.0,<3.0",
    "onnx>=1.17,<2.0",
    "onnxruntime>=1.20,<2.0",
    "pandas>=2.2,<3.0",
    "PyYAML>=6.0,<7.0",
    "scipy>=1.14,<2.0",
    "torch>=2.6,<3.0",
]


[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2,<5.0",
    "mypy>=1.11,<2.0",
    "pandas-stubs>=2.2,<3.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.9,<1.0",
    "types-PyYAML>=6.0,<7.0",
]


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--verbose",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "acdc: tests that require the real ACDC dataset",
    "integration: integration tests covering multiple project components",
]


[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests"]


[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PL",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "UP",
    "W",
]
ignore = [
    "D100",
    "D104",
]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN201",
    "D101",
    "D102",
    "D103",
    "PLR2004",
]
"notebooks/**/*.ipynb" = [
    "D100",
    "E501",
    "T201",
]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true


[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
mypy_path = "src"


[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "nibabel.*",
]
ignore_missing_imports = true
